[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frc-score-sim"
version = "0.1.0"
description = "FRC match simulation with robot client support"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "msgspec>=0.18",
    "msgpack>=1.1.2",
    "uvloop>=0.19; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
frc-sim = "frc_sim.main:main"
frc-robot = "frc_robot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frc_sim", "src/frc_robot"]

[tool.uv]
package = true
