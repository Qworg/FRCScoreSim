[project]
name = "frc-robot-client"
version = "0.1.0"
description = "Python robot client for FRC Score Simulator distributed mode"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "msgpack>=1.1.2",
    "websockets>=12.0",
]

[project.scripts]
robot = "frc_robot.cli:main"

[tool.uv]
package = true
