<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRC Score Simulator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      color: #fff;
    }

    .status-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .status-bar span {
      padding: 5px 12px;
      background: #16213e;
      border-radius: 4px;
    }

    .status-bar .connected {
      color: #4ade80;
    }

    .status-bar .disconnected {
      color: #f87171;
    }

    .game-container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .field-container {
      background: #16213e;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    #field {
      border: 2px solid #333;
      border-radius: 4px;
      background: #2d4a3e;
      /* Scale up for better visibility - 1.5x the field dimensions */
      width: 972px;
      height: 486px;
      image-rendering: pixelated;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-width: 250px;
    }

    .panel {
      background: #16213e;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .panel h3 {
      margin-bottom: 10px;
      font-size: 14px;
      text-transform: uppercase;
      color: #888;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-play {
      background: #4ade80;
      color: #000;
    }

    .btn-play:hover {
      background: #22c55e;
    }

    .btn-pause {
      background: #fbbf24;
      color: #000;
    }

    .btn-pause:hover {
      background: #f59e0b;
    }

    .btn-step {
      background: #60a5fa;
      color: #000;
    }

    .btn-step:hover {
      background: #3b82f6;
    }

    .btn-reset {
      background: #f87171;
      color: #000;
    }

    .btn-reset:hover {
      background: #ef4444;
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .team-score {
      flex: 1;
      text-align: center;
      padding: 15px;
      border-radius: 6px;
    }

    .team-score.red {
      background: rgba(239, 68, 68, 0.2);
      border: 2px solid #ef4444;
    }

    .team-score.blue {
      background: rgba(59, 130, 246, 0.2);
      border: 2px solid #3b82f6;
    }

    .team-score .label {
      font-size: 12px;
      text-transform: uppercase;
      color: #888;
    }

    .team-score .score {
      font-size: 36px;
      font-weight: 700;
    }

    .team-score.red .score {
      color: #ef4444;
    }

    .team-score.blue .score {
      color: #3b82f6;
    }

    .team-score .breakdown {
      font-size: 11px;
      color: #666;
      margin-top: 5px;
    }

    .game-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .info-item {
      background: #0f172a;
      padding: 10px;
      border-radius: 4px;
    }

    .info-item .label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
    }

    .info-item .value {
      font-size: 18px;
      font-weight: 600;
    }

    .info-item .value.phase-auto {
      color: #fbbf24;
    }

    .info-item .value.phase-teleop {
      color: #4ade80;
    }

    .info-item .value.phase-endgame {
      color: #f87171;
    }

    .events-log {
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
      font-family: monospace;
    }

    .event-item {
      padding: 4px 8px;
      border-bottom: 1px solid #222;
    }

    .event-item:nth-child(odd) {
      background: #0f172a;
    }

    .event-time {
      color: #666;
      margin-right: 8px;
    }

    .event-type {
      color: #60a5fa;
    }

    .legend {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      font-size: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 3px;
    }

    .legend-color.red-robot {
      background: #ef4444;
    }

    .legend-color.blue-robot {
      background: #3b82f6;
    }

    .legend-color.ball {
      background: #fbbf24;
      border-radius: 50%;
    }

    .legend-color.goal {
      background: transparent;
      border: 2px solid #888;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <h1>FRC Score Simulator</h1>

  <div class="status-bar">
    <span id="connectionStatus" class="disconnected">Disconnected</span>
    <span id="matchStatus">Waiting...</span>
  </div>

  <div class="game-container">
    <div class="field-container">
      <canvas id="field" width="648" height="324"></canvas>
      <div class="legend" style="margin-top: 10px;">
        <div class="legend-item">
          <div class="legend-color red-robot"></div>
          <span>Red Robot</span>
        </div>
        <div class="legend-item">
          <div class="legend-color blue-robot"></div>
          <span>Blue Robot</span>
        </div>
        <div class="legend-item">
          <div class="legend-color ball"></div>
          <span>Ball</span>
        </div>
        <div class="legend-item">
          <div class="legend-color goal"></div>
          <span>Goal</span>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="panel">
        <h3>Controls</h3>
        <div class="controls">
          <button id="btnPlay" class="btn-play">Play</button>
          <button id="btnPause" class="btn-pause">Pause</button>
          <button id="btnStep" class="btn-step">Step</button>
          <button id="btnReset" class="btn-reset">Reset</button>
        </div>
      </div>

      <div class="panel">
        <h3>Score</h3>
        <div class="scoreboard">
          <div class="team-score red">
            <div class="label">Red Alliance</div>
            <div class="score" id="redScore">0</div>
            <div class="breakdown" id="redBreakdown">A:0 T:0 E:0</div>
          </div>
          <div class="team-score blue">
            <div class="label">Blue Alliance</div>
            <div class="score" id="blueScore">0</div>
            <div class="breakdown" id="blueBreakdown">A:0 T:0 E:0</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3>Match Info</h3>
        <div class="game-info">
          <div class="info-item">
            <div class="label">Phase</div>
            <div class="value" id="phase">-</div>
          </div>
          <div class="info-item">
            <div class="label">Time</div>
            <div class="value" id="time">0:00</div>
          </div>
          <div class="info-item">
            <div class="label">Tick</div>
            <div class="value" id="tick">0</div>
          </div>
          <div class="info-item">
            <div class="label">Balls</div>
            <div class="value" id="balls">0</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3>Events</h3>
        <div class="events-log" id="eventsLog"></div>
      </div>
    </div>
  </div>

  <script>
    // Configuration
    const WS_URL = 'ws://localhost:8080';
    const TICK_RATE = 60;

    // State
    let ws = null;
    let config = null;
    let gameState = null;
    let isPlaying = false;
    let events = [];

    // Canvas setup
    const canvas = document.getElementById('field');
    const ctx = canvas.getContext('2d');

    // DOM elements
    const connectionStatus = document.getElementById('connectionStatus');
    const matchStatus = document.getElementById('matchStatus');
    const btnPlay = document.getElementById('btnPlay');
    const btnPause = document.getElementById('btnPause');
    const btnStep = document.getElementById('btnStep');
    const btnReset = document.getElementById('btnReset');
    const redScore = document.getElementById('redScore');
    const blueScore = document.getElementById('blueScore');
    const redBreakdown = document.getElementById('redBreakdown');
    const blueBreakdown = document.getElementById('blueBreakdown');
    const phaseEl = document.getElementById('phase');
    const timeEl = document.getElementById('time');
    const tickEl = document.getElementById('tick');
    const ballsEl = document.getElementById('balls');
    const eventsLog = document.getElementById('eventsLog');

    // Connect to WebSocket
    function connect() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        connectionStatus.textContent = 'Connected';
        connectionStatus.className = 'connected';
        matchStatus.textContent = 'Ready';
      };

      ws.onclose = () => {
        connectionStatus.textContent = 'Disconnected';
        connectionStatus.className = 'disconnected';
        matchStatus.textContent = 'Connection lost';
        setTimeout(connect, 2000);
      };

      ws.onerror = (err) => {
        console.error('WebSocket error:', err);
      };

      ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        handleMessage(message);
      };
    }

    // Handle incoming messages
    function handleMessage(message) {
      switch (message.type) {
        case 'config':
          config = message.data;
          if (config && config.field) {
            canvas.width = config.field.width;
            canvas.height = config.field.height;
          }
          render();
          break;

        case 'state':
          gameState = message.data;
          updateUI();
          render();
          break;

        case 'event':
          addEvent(message.data);
          break;
      }
    }

    // Add event to log
    function addEvent(event) {
      events.unshift(event);
      if (events.length > 50) events.pop();
      renderEvents();
    }

    // Render events log
    function renderEvents() {
      eventsLog.innerHTML = events.map(e => {
        const time = (e.tick / TICK_RATE).toFixed(1);
        return `<div class="event-item">
          <span class="event-time">[${time}s]</span>
          <span class="event-type">${e.type}</span>
          ${e.robotId ? ` - ${e.robotId}` : ''}
          ${e.points ? ` +${e.points}pts` : ''}
        </div>`;
      }).join('');
    }

    // Update UI elements
    function updateUI() {
      if (!gameState) return;

      // Score
      redScore.textContent = gameState.score.red.total;
      blueScore.textContent = gameState.score.blue.total;
      redBreakdown.textContent = `A:${gameState.score.red.auto} T:${gameState.score.red.teleop} E:${gameState.score.red.endgame}`;
      blueBreakdown.textContent = `A:${gameState.score.blue.auto} T:${gameState.score.blue.teleop} E:${gameState.score.blue.endgame}`;

      // Phase
      phaseEl.textContent = gameState.phase;
      phaseEl.className = 'value phase-' + gameState.phase.toLowerCase();

      // Time
      const totalSeconds = Math.floor(gameState.tick / TICK_RATE);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      timeEl.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

      // Tick
      tickEl.textContent = gameState.tick;

      // Balls on field
      const availableBalls = gameState.balls.filter(b => b.state === 'ON_FIELD').length;
      ballsEl.textContent = availableBalls;

      // Match status
      if (gameState.phase === 'POST_MATCH') {
        const winner = gameState.score.red.total > gameState.score.blue.total ? 'Red' :
                       gameState.score.blue.total > gameState.score.red.total ? 'Blue' : 'Tie';
        matchStatus.textContent = `Match Over - ${winner} Wins!`;
      } else {
        matchStatus.textContent = `${gameState.phase} - Playing`;
      }
    }

    // Render the field
    function render() {
      // Clear canvas
      ctx.fillStyle = '#2d4a3e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw field markings
      drawFieldMarkings();

      // Draw scoring targets
      if (config) {
        drawScoringTargets();
      }

      // Draw game objects
      if (gameState) {
        drawBalls();
        drawRobots();
      }
    }

    // Draw field markings
    function drawFieldMarkings() {
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1;

      // Center line
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();

      // Auto line (approximately)
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(canvas.width * 0.25, 0);
      ctx.lineTo(canvas.width * 0.25, canvas.height);
      ctx.moveTo(canvas.width * 0.75, 0);
      ctx.lineTo(canvas.width * 0.75, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Field border
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);
    }

    // Draw scoring targets
    function drawScoringTargets() {
      for (const target of config.field.scoringTargets) {
        const color = target.alliance === 'red' ? '#ef4444' : '#3b82f6';

        // Draw target circle
        ctx.beginPath();
        ctx.arc(target.position.x, canvas.height - target.position.y, target.radius, 0, Math.PI * 2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.stroke();

        // Draw target fill (semi-transparent)
        ctx.fillStyle = color + '20';
        ctx.fill();

        // Draw target label
        ctx.fillStyle = color;
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(target.name, target.position.x, canvas.height - target.position.y + target.radius + 12);
      }
    }

    // Draw balls
    function drawBalls() {
      for (const ball of gameState.balls) {
        if (ball.state === 'HELD' || ball.state === 'SCORED') continue;

        const x = ball.position.x;
        const y = canvas.height - ball.position.y;
        const radius = 4; // Smaller for better visibility with 360+ balls

        // Ball shadow (if in flight)
        if (ball.state === 'IN_FLIGHT') {
          ctx.beginPath();
          ctx.arc(x, y + 5, radius * 0.8, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.fill();
        }

        // Ball
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);

        // Gradient for 3D effect
        const gradient = ctx.createRadialGradient(x - 2, y - 2, 0, x, y, radius);
        gradient.addColorStop(0, '#fde047');
        gradient.addColorStop(1, '#ca8a04');
        ctx.fillStyle = gradient;
        ctx.fill();

        // Ball outline
        ctx.strokeStyle = '#a16207';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    // Draw robots
    function drawRobots() {
      for (const robot of gameState.robots) {
        const x = robot.position.x;
        const y = canvas.height - robot.position.y;
        const width = robot.config.width;
        const length = robot.config.length;
        const heading = -robot.heading * Math.PI / 180; // Convert to radians, flip for canvas

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(heading);

        // Robot body
        const color = robot.alliance === 'red' ? '#ef4444' : '#3b82f6';
        const darkColor = robot.alliance === 'red' ? '#b91c1c' : '#1d4ed8';

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(-width/2 + 3, -length/2 + 3, width, length);

        // Main body
        ctx.fillStyle = color;
        ctx.fillRect(-width/2, -length/2, width, length);

        // Direction indicator (front of robot)
        ctx.fillStyle = darkColor;
        ctx.fillRect(-width/2, -length/2, width, 6);

        // Robot outline
        ctx.strokeStyle = darkColor;
        ctx.lineWidth = 2;
        ctx.strokeRect(-width/2, -length/2, width, length);

        // Robot ID
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(robot.id.split('-')[1] || robot.id, 0, 0);

        // Ball count indicator
        if (robot.heldBalls.length > 0) {
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.arc(width/2 - 5, -length/2 + 5, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#000';
          ctx.font = 'bold 8px sans-serif';
          ctx.fillText(robot.heldBalls.length.toString(), width/2 - 5, -length/2 + 5);
        }

        // Action indicator
        if (robot.currentAction.type !== 'IDLE') {
          ctx.fillStyle = 'rgba(255,255,255,0.8)';
          ctx.font = '8px sans-serif';
          ctx.fillText(robot.currentAction.type, 0, length/2 + 10);
        }

        ctx.restore();
      }
    }

    // Button handlers
    btnPlay.addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'play' }));
        isPlaying = true;
      }
    });

    btnPause.addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'pause' }));
        isPlaying = false;
      }
    });

    btnStep.addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'step' }));
      }
    });

    btnReset.addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'reset' }));
        events = [];
        renderEvents();
      }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case ' ':
          e.preventDefault();
          if (isPlaying) {
            btnPause.click();
          } else {
            btnPlay.click();
          }
          break;
        case 'ArrowRight':
          e.preventDefault();
          btnStep.click();
          break;
        case 'r':
          if (e.ctrlKey) {
            e.preventDefault();
            btnReset.click();
          }
          break;
      }
    });

    // Initial render
    render();

    // Connect to server
    connect();
  </script>
</body>
</html>
